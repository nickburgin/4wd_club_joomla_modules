services:
  build: &build
    build:
      context: .
      target: build-env
      dockerfile: Dockerfile
    environment:
      GITHUB_REPO: '${GITHUB_REPO:-https://github.com/nickburgin/4wd_club_joomla_modules}'
      GITHUB_TOKEN: '${GITHUB_TOKEN:-}'
      BUILD_NUMBER: '${BUILD_NUMBER:-}'
      BUILDKITE_COMMIT: '${BUILDKITE_COMMIT:-}'
    working_dir: /work
    volumes:
      - .:/work:z

  docs:
    <<: *build
    build:
      context: .
      target: docs-env
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

  joomla:
    image: joomla:5
    ports:
      - "8080:80"
    environment:
      JOOMLA_DB_HOST: db
      JOOMLA_DB_USER: joomla
      JOOMLA_DB_PASSWORD: joomla
      JOOMLA_DB_NAME: joomla
    volumes:
      - joomla_html:/var/www/html
      - ./dist:/tmp/packages:ro
    depends_on:
      - db

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: joomla
      MYSQL_USER: joomla
      MYSQL_PASSWORD: joomla
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  joomla_html:
  mysql_data:
